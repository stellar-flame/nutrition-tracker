AWSTemplateFormatVersion: '2010-09-09'
Description: Fargate service with ALB for the Nutrition application.

Parameters:
  ImageTag:
    Description: Docker image tag for the Nutrition application
    Type: String
    Default: latest

  CertificateArn:
    Description: ARN of the ACM certificate for HTTPS
    Type: String

Resources:
  ExecutionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: ecs-tasks.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
        Policies:
        - PolicyName: 'read-parameters-and-decrypt'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameters
                  - ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nutrition/dev/DATABASE_URL"
              - Effect: Allow
                Action:
                  - ssm:GetParameters
                  - ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nutrition/dev/OPENAI_API_KEY"
              - Effect: Allow
                Action:
                  - ssm:GetParameters
                  - ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nutrition/dev/INTERNAL_TOKEN"
              - Effect: Allow
                Action:
                  - ssm:GetParameters
                  - ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nutrition/dev/INTERNAL_API_URL"
              - Effect: Allow
                Action:
                  - ssm:GetParameters
                  - ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nutrition/dev/COGNITO_USER_POOL_ID"
              - Effect: Allow
                Action:
                  - ssm:GetParameters
                  - ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nutrition/dev/COGNITO_APP_CLIENT_ID"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
      - PolicyName: cfn-exec-ssmmessages
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - "ssmmessages:CreateControlChannel"
                - "ssmmessages:CreateDataChannel"
                - "ssmmessages:OpenControlChannel"
                - "ssmmessages:OpenDataChannel"
              Resource: "*"
      - PolicyName: sqs-send-message
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:NutritionMealQueue"
      - PolicyName: dynamodb-pending-meals
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
              Resource:
                - !ImportValue NutritionPendingMealsTableArn
                - !Sub
                  - "${TableArn}/index/UserDateIndex"
                  - TableArn: !ImportValue NutritionPendingMealsTableArn

  ApiLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /ecs/nutrition-tracker
        RetentionInDays: 14

  TaskDefinition:
      Type: AWS::ECS::TaskDefinition
      Properties:
        Family: nutrition-task
        Cpu: '256'
        Memory: '512'
        NetworkMode: awsvpc
        RequiresCompatibilities:
          - FARGATE
        ExecutionRoleArn: !GetAtt ExecutionRole.Arn
        TaskRoleArn: !GetAtt TaskRole.Arn
        ContainerDefinitions:
          - Name: nutrition-container
            Image: !Sub "havz/nutrition-tracker-api:${ImageTag}"
            PortMappings:
              - ContainerPort: 8000
            LogConfiguration:
              LogDriver: awslogs
              Options:
                awslogs-group: !Ref ApiLogGroup
                awslogs-region: !Ref AWS::Region
                awslogs-stream-prefix: nutrition
            Environment:
              - Name: COGNITO_REGION
                Value: !Ref AWS::Region
              - Name: SQS_QUEUE_URL
                Value: !Sub "https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/NutritionMealQueue"
              - Name: DYNAMODB_PENDING_MEALS_TABLE
                Value: !ImportValue NutritionPendingMealsTableName
            Secrets:
              - Name: OPENAI_API_KEY
                ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nutrition/dev/OPENAI_API_KEY"
              - Name: INTERNAL_TOKEN
                ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nutrition/dev/INTERNAL_TOKEN"
              - Name: INTERNAL_API_URL
                ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nutrition/dev/INTERNAL_API_URL"
              - Name: DATABASE_URL
                ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nutrition/dev/DATABASE_URL"
              - Name: COGNITO_USER_POOL_ID
                ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nutrition/dev/COGNITO_USER_POOL_ID"
              - Name: COGNITO_APP_CLIENT_ID
                ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nutrition/dev/COGNITO_APP_CLIENT_ID"
  ECSCluster:
      Type: AWS::ECS::Cluster
      Properties:
        ClusterName: nutrition-ecs-cluster
    
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !ImportValue NutritionVpc
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /health
      Matcher:
        HttpCode: 200-299

  ALBLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Subnets:
        - !ImportValue NutritionPublicSubnet1
        - !ImportValue NutritionPublicSubnet2
      SecurityGroups:
        - !ImportValue NutritionALBSecurityGroup
      Tags:
        - Key: Name
          Value: nutrition-alb

  ALBListenerHTTPS:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALBLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  ALBListenerHTTPRedirect:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALBLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  ECSService:
    Type: AWS::ECS::Service
    DependsOn:
      - ALBListenerHTTPS
    Properties:
      Cluster: !Ref ECSCluster
      ServiceName: nutrition-ecs-service
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      EnableExecuteCommand: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !ImportValue NutritionPublicSubnet1
            - !ImportValue NutritionPublicSubnet2
          SecurityGroups:
            - !ImportValue NutritionECSFargateSecurityGroup

      LoadBalancers:
        - TargetGroupArn: !Ref TargetGroup
          ContainerName: nutrition-container
          ContainerPort: 8000

  ApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: nutritionapptracker.com.
      Name: api.nutritionapptracker.com.
      Type: A
      AliasTarget:
        DNSName: !GetAtt ALBLoadBalancer.DNSName
        HostedZoneId: !GetAtt ALBLoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: true

Outputs:
  ALBDNSName:
    Description: ALB DNS name for the Nutrition application
    Value: !GetAtt ALBLoadBalancer.DNSName
    Export:
      Name: NutritionALBDNSName
  TaskRoleArn:
    Description: ARN of the ECS task role
    Value: !GetAtt TaskRole.Arn
    Export:
      Name: NutritionECSTaskRoleArn